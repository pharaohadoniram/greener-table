# Rebuilds and publishes the site to GitHub Pages whenever anything is saved to main
# (including every save from Pages CMS).
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Straighten and shrink large photos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          # -auto-orient applies the phone’s rotation tag before -strip removes it, so photos never end up sideways.
          find site/assets -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -size +400k \
            -exec mogrify -auto-orient -resize '1600x1600>' -quality 80 -strip {} \;
      - name: Build
        run: node build/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
