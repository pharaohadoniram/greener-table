<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe · The Greener Table</title>
  <meta name="description" content="A plant-forward recipe from The Greener Table.">
  <link rel="icon" href="brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="recipe.css">
</head>
<body class="recipe-page">

<header class="site-header">
  <div class="wrap nav">
    <a class="logo" href="index.html" aria-label="The Greener Table home"><img src="brand/logo.png" alt="The Greener Table"></a>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    <ul>
      <li><a href="index.html#experience">The Experience</a></li>
      <li><a href="index.html#hosts">Your Hosts</a></li>
      <li><a href="recipes.html">Recipes</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="testimonials.html">Kind Words</a></li>
      <li><a href="index.html#how">How It Works</a></li>
      <li><a class="btn" href="index.html#book">Book a Class</a></li>
    </ul>
  </div>
</header>

<main id="recipe">
  <noscript><div class="wrap r-missing"><p>Please enable JavaScript to view this recipe, or <a href="recipes.html">browse all recipes</a>.</p></div></noscript>
</main>

<footer>
  <div class="wrap">
    <img src="brand/logo.png" alt="The Greener Table">
    <p class="tag">Cheers to a life full of food, friends and fun.</p>
    <nav>
      <a href="index.html#experience">The Experience</a>
      <a href="index.html#philosophy">Philosophy</a>
      <a href="index.html#hosts">Your Hosts</a>
      <a href="recipes.html">Recipes</a>
      <a href="gallery.html">Gallery</a>
      <a href="testimonials.html">Kind Words</a>
      <a href="index.html#how">How It Works</a>
      <a href="index.html#book">Book</a>
    </nav>
    <small>© 2026 The Greener Table · San Francisco &amp; Napa</small>
  </div>
</footer>

<script src="recipes/recipes.js"></script>
<script>
  // Renders one recipe from recipes/recipes.js, chosen by ?r=<slug>.
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const all = window.RECIPES || [];
  const slug = new URLSearchParams(location.search).get('r');
  const i = all.findIndex(x => x.slug === slug);
  const main = document.getElementById('recipe');

  const ingList = items => `<ul class="ing-list">${items.map(([n, a]) =>
    `<li><label><input type="checkbox"><span class="ing-name">${esc(n)}</span><span class="ing-amt">${esc(a)}</span></label></li>`).join('')}</ul>`;

  if (i < 0) {
    main.innerHTML = `<div class="wrap r-missing"><p class="eyebrow">Recipe not found</p><h1>We couldn’t find that recipe</h1><p><a class="btn" href="recipes.html">Browse all recipes</a></p></div>`;
  } else {
    const r = all[i];
    const prev = all[(i - 1 + all.length) % all.length];
    const next = all[(i + 1) % all.length];
    document.title = `${r.title} · The Greener Table`;
    document.querySelector('meta[name=description]').setAttribute('content', `${r.title} ${r.subtitle}: a plant-forward recipe from The Greener Table.`);

    main.innerHTML = `
  <section class="r-hero">
    <div class="wrap">
      <div class="r-hero-text">
        <a class="back" href="recipes.html"><span aria-hidden="true">←</span> All recipes</a>
        <p class="eyebrow">${esc(r.region)}</p>
        <h1>${esc(r.title)}</h1>
        <p class="r-sub">${esc(r.subtitle)}</p>
        <p class="r-intro">${esc(r.intro)}</p>
        <dl class="stats">
          <div><dt>Prep</dt><dd>${esc(r.glance.prep)}<small>min</small></dd></div>
          <div><dt>Cook</dt><dd>${esc(r.glance.cook)}<small>min</small></dd></div>
          <div><dt>Serves</dt><dd>${esc(r.glance.serves)}</dd></div>
        </dl>
        <div class="r-actions">
          <button class="btn" type="button" onclick="window.print()">Print recipe</button>
          ${r.pdf ? `<a class="text-link" href="recipes/${esc(r.pdf)}" target="_blank" rel="noopener">Original PDF</a>` : ''}
        </div>
      </div>
      <aside class="origin-card">
        <p class="eyebrow">Origin</p>
        <p class="origin-text">${esc(r.origin)}</p>
        <div class="mise">
          <p class="eyebrow">Mise en place</p>
          <p class="mise-intro">Everything in its place before the cooking begins.</p>
          <ul>${r.mise.map(([k, v]) => `<li><span>${esc(k)}</span>${esc(v)}</li>`).join('')}</ul>
        </div>
      </aside>
    </div>
  </section>

  <section class="r-cook">
    <div class="wrap">
      <aside class="ingredients">
        <div class="col-head"><p class="eyebrow">Ingredients</p><p class="hint">Tap to check off</p></div>
        ${r.ingredients.map(g => `
          <div class="ing-group">
            <h3>${esc(g.group)}</h3>
            ${ingList(g.items)}
            ${g.swap ? `<p class="swap">${esc(g.swap)}</p>` : ''}
          </div>`).join('')}
        ${r.prepNote ? `<p class="prep-note">${r.prepNote}</p>` : ''}
      </aside>
      <div class="directions">
        <div class="col-head"><p class="eyebrow">Directions</p><p class="hint">Cook in layers</p></div>
        <ol class="step-list">${r.steps.map((s, n) => `
          <li class="step-block">
            <div class="step-num">${n + 1}</div>
            <div>
              <h3>${esc(s.title)}</h3>
              ${s.items.length > 1 ? `<ul class="sub-steps">${s.items.map(t => `<li>${t}</li>`).join('')}</ul>` : `<p>${s.items[0]}</p>`}
              ${s.note ? `<div class="step-note"><p class="note-title">${esc(s.note.title)}</p><ul>${s.note.items.map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
            </div>
          </li>`).join('')}
        </ol>
        ${r.extra ? `
        <div class="extra-card">
          <p class="eyebrow">${esc(r.extra.eyebrow)}</p>
          <h2>${esc(r.extra.title)}</h2>
          <div class="extra-versions">${r.extra.versions.map(v => `<div><h3>${esc(v.name)}</h3>${ingList(v.items)}</div>`).join('')}</div>
          <p class="extra-method"><b>Method.</b> ${esc(r.extra.method)}</p>
        </div>` : ''}
        ${r.tips && r.tips.length ? `
        <div class="tips">
          <p class="eyebrow">Quick tips</p>
          <div class="tip-grid">${r.tips.map(([k, v]) => `<div class="tip"><h3>${esc(k)}</h3><p>${esc(v)}</p></div>`).join('')}</div>
        </div>` : ''}
      </div>
    </div>
  </section>

  <section class="r-more">
    <div class="wrap">
      <div class="nutrition">
        <p class="eyebrow">Nutritional information</p>
        <h2>What’s <em>on your plate</em></h2>
        <p class="sub">Estimated values for the key ingredients.</p>
        <div class="nut-list">${r.nutrition.map(n => `
          <div class="nut"><h3>${esc(n.name)}</h3><ul class="facts">${n.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul><p>${esc(n.notes)}</p></div>`).join('')}
        </div>
      </div>
      <div class="notebook">
        <p class="eyebrow">Good to know</p>
        <h2>From <em>Stacy’s</em> notebook</h2>
        ${r.learn.map(l => `
        <article class="learn-item">
          <h3>${esc(l.q)}</h3>
          ${l.paras.map(p => `<p>${esc(p)}</p>`).join('')}
          ${l.list ? `<h4>${esc(l.list.title)}</h4><dl class="learn-dl">${l.list.items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
          ${l.benefits ? `<h4>${esc(l.benefits.title)}</h4><ul class="learn-benefits">${l.benefits.items.map(([k, v]) => `<li><b>${esc(k)}.</b> ${esc(v)}</li>`).join('')}</ul>` : ''}
        </article>`).join('')}
      </div>
    </div>
  </section>

  <section class="r-end">
    <div class="wrap">
      <a class="pager" href="recipe.html?r=${prev.slug}"><span class="eyebrow">Previous</span><span class="p-title">${esc(prev.title)}</span></a>
      <div class="r-cta">
        <p>Want to cook this one together?</p>
        <a class="btn" href="index.html#book">Book an experience</a>
      </div>
      <a class="pager next" href="recipe.html?r=${next.slug}"><span class="eyebrow">Next</span><span class="p-title">${esc(next.title)}</span></a>
    </div>
  </section>`;
  }

  const header = document.querySelector('.site-header');
  const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  const toggle = document.querySelector('.menu-toggle');
  const links = document.querySelector('.nav ul');
  toggle.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });
</script>
</body>
</html>
